# Keeps the free Supabase project from being paused after a week without activity:
# once a day it writes a heartbeat row through public.keep_alive()
# (supabase/migrations/20261012090000_keep_alive.sql). The app is not involved.
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 6 * * *" # every day, 06:17 UTC
  workflow_dispatch: # "Run workflow" button in the Actions tab

permissions:
  actions: write # to re-enable this workflow below
  contents: read

concurrency:
  group: supabase-keep-alive
  cancel-in-progress: false

env:
  # The same public values the app ships with (cloud/data/remote/SupabaseConfig.kt)
  SUPABASE_URL: https://hjobtzpaqxehngjgfhfr.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_HppXr51uu1nBQEuIwN-hEw_B6gtK5g3

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the database
        run: |
          last_ping=$(curl --silent --show-error --fail-with-body \
            --retry 5 --retry-delay 30 --retry-all-errors --max-time 60 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/keep_alive" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "Supabase heartbeat: $last_ping"

      # GitHub turns off scheduled workflows in public repos after 60 days without commits;
      # enabling it again on every run keeps it going
      - name: Keep this schedule enabled
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/supabase-keep-alive.yml/enable"
